# Spin the Wheel – Release on Tag
# Bei Tag-Push: Release anlegen, alle Plattformen bauen, Artefakte ins Release hochladen.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Spin the Wheel ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: "Artefakte werden nach den Builds hinzugefügt."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install
      - run: pnpm tauri build --target universal-apple-darwin
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-appimage:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install
      - run: NO_STRIP=true pnpm tauri build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install
      - run: NO_STRIP=true pnpm tauri build --bundles deb
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - run: pnpm tauri build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: pnpm/action-setup@v4
        with:
          version: 9
  
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
  
      - uses: dtolnay/rust-toolchain@stable
  
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
  
      - uses: android-actions/setup-android@v3
  
      - name: Set Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls -1 $ANDROID_SDK_ROOT/ndk | sort -V | tail -n 1)" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls -1 $ANDROID_SDK_ROOT/ndk | sort -V | tail -n 1)" >> $GITHUB_ENV
  
      - run: pnpm install
  
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
  
      - name: Init Android project
        run: pnpm tauri android init --ci
  
      - name: Setup Android signing (Tauri method)
        run: |
          cd src-tauri/gen/android
          
          # Decode keystore from repo
          base64 -d ${{ github.workspace }}/.github/keystore.base64 > $RUNNER_TEMP/release.keystore
          
          # Create keystore.properties as per Tauri docs
          cat > keystore.properties <<EOF
          keyAlias=spin-my-wheel
          password=spinmywheel2025
          storeFile=$RUNNER_TEMP/release.keystore
          EOF
  
      - name: Create signing config (Groovy)
        run: |
          cd src-tauri/gen/android/app
          
          # Create a separate Groovy gradle file for signing (easier than patching Kotlin DSL)
          cat > signing.gradle <<'EOF'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              
              android {
                  signingConfigs {
                      release {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['password']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['password']
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          EOF
          
          # Apply the signing config
          echo "" >> build.gradle.kts
          echo "apply from: 'signing.gradle'" >> build.gradle.kts
  
      - name: Build signed APKs + AABs (release)
        run: pnpm tauri android build
  
      - name: Upload Android artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
